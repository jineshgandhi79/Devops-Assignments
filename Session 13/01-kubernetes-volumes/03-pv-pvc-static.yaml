apiVersion: v1
kind: PersistentVolume
metadata:
  name: manual-pv-10gi
  labels:
    type: local-storage
    env: production
spec:
  capacity:
    storage: 10Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /mnt/data/app-storage
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: manual-app-pvc
  labels:
    app: stateful-app
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: manual
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: pv-pvc-demo-pod
spec:
  containers:
  - name: data-writer
    image: busybox:1.36
    command: ["sh", "-c"]
    args:
    - >
      echo "Stateful storage mounted successfully on $(date)" >> /var/app/state.txt;
      echo "Current file content:";
      cat /var/app/state.txt;
      sleep 3600;
    volumeMounts:
    - name: data-vol
      mountPath: /var/app
  volumes:
  - name: data-vol
    persistentVolumeClaim:
      claimName: manual-app-pvc
