apiVersion: v1
kind: Pod
metadata:
  name: hostpath-demo-pod
  labels:
    app: hostpath-demo
spec:
  containers:
  - name: node-log-reader
    image: busybox:1.36
    command: ["sh", "-c"]
    args:
    - >
      echo "Reading host logs from /host-logs:";
      ls -lh /host-logs | head -n 5;
      sleep 3600;
    volumeMounts:
    - name: host-log-volume
      mountPath: /host-logs
      readOnly: true
  volumes:
  - name: host-log-volume
    hostPath:
      path: /var/log
      type: Directory
