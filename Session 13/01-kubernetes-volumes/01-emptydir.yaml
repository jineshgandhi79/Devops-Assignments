apiVersion: v1
kind: Pod
metadata:
  name: emptydir-demo-pod
  labels:
    app: emptydir-demo
spec:
  containers:
  - name: producer
    image: busybox:1.36
    command: ["sh", "-c"]
    args:
    - >
      while true; do
        echo "[$(date -u +%T)] Data generated by producer container" >> /cache/data.log;
        sleep 5;
      done
    volumeMounts:
    - name: shared-cache
      mountPath: /cache
  - name: consumer
    image: busybox:1.36
    command: ["sh", "-c"]
    args:
    - >
      while true; do
        if [ -f /cache/data.log ]; then
          tail -n 2 /cache/data.log;
        fi;
        sleep 5;
      done
    volumeMounts:
    - name: shared-cache
      mountPath: /cache
      readOnly: true
  volumes:
  - name: shared-cache
    emptyDir:
      medium: ""
      sizeLimit: 100Mi
