apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
  labels:
    app: load-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: load-generator
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      containers:
      - name: busybox-loader
        image: busybox:1.36
        command: ["sh", "-c"]
        args:
        - >
          echo "Starting continuous HTTP load on http://php-apache...";
          while true; do
            wget -q -O- http://php-apache > /dev/null;
          done
