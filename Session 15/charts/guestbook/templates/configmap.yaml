apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "guestbook.fullname" . }}-config
  labels:
    {{- include "guestbook.labels" . | nindent 4 }}
data:
  title: {{ .Values.appConfig.title | quote }}
  welcomeMessage: {{ .Values.appConfig.welcomeMessage | quote }}
  environment: {{ .Values.appConfig.environment | quote }}
  enableAnalytics: {{ .Values.appConfig.enableAnalytics | quote }}
