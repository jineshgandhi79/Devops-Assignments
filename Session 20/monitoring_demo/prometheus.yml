global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "alert_rules.yml"

scrape_configs:
  - job_name: "order-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["127.0.0.1:8000"]
        labels:
          environment: "production"
          service: "order-api"
