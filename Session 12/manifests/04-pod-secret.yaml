apiVersion: v1
kind: Pod
metadata:
  name: demo-pod-secret
  labels:
    app: demo-app
spec:
  containers:
  - name: secured-container
    image: nginx:alpine
    ports:
    - containerPort: 80
    env:
    # 1. Inject Secret key as environment variable
    - name: DATABASE_USER
      valueFrom:
        secretKeyRef:
          name: app-secret
          key: DB_USERNAME
    - name: DATABASE_PASS
      valueFrom:
        secretKeyRef:
          name: app-secret
          key: DB_PASSWORD
    - name: APP_API_KEY
      valueFrom:
        secretKeyRef:
          name: app-secret
          key: API_KEY
    volumeMounts:
    # 2. Inject Secret as read-only mounted files
    - name: secret-volume
      mountPath: /etc/secrets
      readOnly: true
  volumes:
  - name: secret-volume
    secret:
      secretName: app-secret
      defaultMode: 0400 # Strict read-only permissions for owner only
