apiVersion: v1
kind: Pod
metadata:
  name: pod-probes-demo
  labels:
    app: lifecycle-probes
spec:
  containers:
  - name: healthy-app
    image: nginx:1.24
    ports:
    - containerPort: 80
    startupProbe:
      httpGet:
        path: /
        port: 80
      initialDelaySeconds: 2
      periodSeconds: 3
    livenessProbe:
      httpGet:
        path: /
        port: 80
      initialDelaySeconds: 5
      periodSeconds: 5
    readinessProbe:
      httpGet:
        path: /
        port: 80
      initialDelaySeconds: 3
      periodSeconds: 5
