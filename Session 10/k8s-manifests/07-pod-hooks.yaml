apiVersion: v1
kind: Pod
metadata:
  name: pod-hooks-demo
  labels:
    app: lifecycle-hooks
spec:
  containers:
  - name: hooked-container
    image: nginx:1.24
    lifecycle:
      postStart:
        exec:
          command: ["/bin/sh", "-c", "echo 'Container started at $(date)' > /usr/share/nginx/html/status.html"]
      preStop:
        exec:
          command: ["/bin/sh", "-c", "echo 'Container stopping gracefully...' > /usr/share/nginx/html/shutdown.log; sleep 10"]
    ports:
    - containerPort: 80
