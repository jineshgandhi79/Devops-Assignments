apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-blue
  labels:
    app: bluegreen-app
    version: blue
spec:
  replicas: 3
  selector:
    matchLabels:
      app: bluegreen-app
      version: blue
  template:
    metadata:
      labels:
        app: bluegreen-app
        version: blue
    spec:
      containers:
      - name: web-app
        image: nginx:1.24
        ports:
        - containerPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-green
  labels:
    app: bluegreen-app
    version: green
spec:
  replicas: 3
  selector:
    matchLabels:
      app: bluegreen-app
      version: green
  template:
    metadata:
      labels:
        app: bluegreen-app
        version: green
    spec:
      containers:
      - name: web-app
        image: nginx:1.25
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: bluegreen-service
  labels:
    app: bluegreen-app
spec:
  type: ClusterIP
  selector:
    app: bluegreen-app
    version: blue
  ports:
  - port: 80
    targetPort: 80
