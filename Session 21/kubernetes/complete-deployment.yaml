apiVersion: v1
kind: Namespace
metadata:
  name: devops-production
  labels:
    environment: production
    managed-by: gitops
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: portal-config
  namespace: devops-production
  labels:
    app.kubernetes.io/name: devops-portal
data:
  APP_ENV: "production"
  PORT: "8080"
  LOG_LEVEL: "info"
  METRICS_ENABLED: "true"
  DATA_STORAGE_PATH: "/data/portal-data.log"
---
apiVersion: v1
kind: Secret
metadata:
  name: portal-secret
  namespace: devops-production
  labels:
    app.kubernetes.io/name: devops-portal
type: Opaque
stringData:
  DB_PASSWORD: "SuperSecretProductionPassword#2026"
  API_KEY: "prod-key-7848f920a-live"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: portal-pvc
  namespace: devops-production
  labels:
    app.kubernetes.io/name: devops-portal
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-portal-deployment
  namespace: devops-production
  labels:
    app.kubernetes.io/name: devops-portal
    app.kubernetes.io/instance: devops-portal-prod
spec:
  replicas: 3
  selector:
    matchLabels:
      app: devops-portal
  template:
    metadata:
      labels:
        app: devops-portal
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: devops-portal
          image: jinesh/devops-portal:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: portal-config
            - secretRef:
                name: portal-secret
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: persistent-storage
              mountPath: /data
      volumes:
        - name: persistent-storage
          persistentVolumeClaim:
            claimName: portal-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: devops-portal-service
  namespace: devops-production
  labels:
    app.kubernetes.io/name: devops-portal
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: devops-portal
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-portal-ingress
  namespace: devops-production
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  rules:
    - host: portal.devops.company.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: devops-portal-service
                port:
                  number: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: devops-portal-hpa
  namespace: devops-production
  labels:
    app.kubernetes.io/name: devops-portal
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: devops-portal-deployment
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
